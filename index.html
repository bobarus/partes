<script>
/* ── КОНФИГ ── */
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyHt8IdYheoEaHuBS23ggbr3d4oqtL_MtcIXk8UyYYeQgpMOZ6iQusB7Jcez5H36M3P/exec";
const PRICE_PER_HOUR = 28;

/* Дефолтные значения — заменяются при синхронизации */
const CLIENTES  = ["CASA FUSTER","PROCOIN","FALCK"];
const OBRAS     = ["ORIGINAL","CENTRO","LA MASIA","SANT QUIRZE","FALCK BASE"];
const OPERARIOS = ["MOHA","ABDEL","ALI","YASSINE","LASHEN"];
const COMPANIAS = ["OBRAMAT","FERROS CASANOVAS","SALTOKI"];
const TIPOS     = [
  "Construcción / Строительные работы","Demolición / Демонтаж",
  "Movimiento de tierras / Земляные работы","Instalaciones / Инженерные работы",
  "Acabados / Отделочные работы","Impermeabilización / Гидроизоляционные работы",
  "Limpieza / Уборка","Transporte / Транспортировка",
  "Carga y descarga / Погрузка и разгрузка","Montaje / Монтаж",
  "Desmontaje / Демонтаж оборудования","Mantenimiento / Техническое обслуживание",
  "Inspección y control / Проверка и контроль","Replanteo / Разбивочные работы"
];

/* ── JSONP CALLBACK — вызывается скриптом с сервера ── */
function _gasCallback(json) {
  try {
    if (json.status !== 'ok' || !json.data) return;
    const d = json.data;
    if (d.clientes  && d.clientes.length)  { CLIENTES.length=0;  d.clientes.forEach(v=>CLIENTES.push(v)); }
    if (d.obras     && d.obras.length)     { OBRAS.length=0;     d.obras.forEach(v=>OBRAS.push(v)); }
    if (d.operarios && d.operarios.length) { OPERARIOS.length=0; d.operarios.forEach(v=>OPERARIOS.push(v)); }
    if (d.companias && d.companias.length) { COMPANIAS.length=0; d.companias.forEach(v=>COMPANIAS.push(v)); }
    if (d.tipos     && d.tipos.length)     { TIPOS.length=0;     d.tipos.forEach(v=>TIPOS.push(v)); }
    buildAllSelects();
    try { localStorage.setItem('partes_lists', JSON.stringify(d)); } catch(e){}
    console.log('✅ Synced:', CLIENTES.length,'clients,',OPERARIOS.length,'operarios');
  } catch(e) { console.log('Callback error:', e.message); }
}
</script>

const T = {
  es:{title:'Parte de trabajo',s1:'Identificación',s1req:'• obligatorio',s2:'Personal',s3:'Trabajo',s5:'Materiales',

let lang='es';

function toggleLang(e){e.stopPropagation();document.getElementById('langDrop').classList.toggle('open');}
document.addEventListener('click',()=>document.getElementById('langDrop').classList.remove('open'));

function setL(l){
  lang=l;
  document.getElementById('langDrop').classList.remove('open');
  ['optEs','optRu','optEn'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(l==='es'?'optEs':l==='ru'?'optRu':'optEn').classList.add('active');
  apply(); buildAllSelects();
}

function apply(){
  const t=T[lang];
  const simple={nTitle:'title',s1lbl:'s1',s1req:'s1req',s2lbl:'s2',s3lbl:'s3',s5lbl:'s5',
    lFotosObra:'lFotosObra',lFotosMat:'lFotosMat',addO:'addO',addM:'addM',
    btnSave:'btnSave',btnClear:'btnClear',ctTL:'ctList',ctTN:'ctOtro',ctCL:'ctList',ctCN:'ctNew'};
  for(const[id,key]of Object.entries(simple)){const el=document.getElementById(id);if(el)el.textContent=t[key];}
  ['lCliente','lObra','lFecha','lOp','lTipo','lHoras'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.childNodes[0].textContent=t[id]+' ';
  });
  ['lAy','lVeh','lTrab','lComp','lMat','lPrecio'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.textContent=t[id];
  });
  document.getElementById('vehiculo').placeholder=t.vehPh;
  document.getElementById('tipoNew').placeholder=t.tipoNewPh;
  document.getElementById('companiaNew').placeholder=t.compPh;
  document.getElementById('trabajos').placeholder=t.trabPh;
  document.getElementById('materiales').placeholder=t.matPh;
  document.getElementById('horas').placeholder=t.horasPh;
  document.getElementById('precio').placeholder=t.precPh;
}

function buildSelect(id,items,ph,preserve=true){
  const sel=document.getElementById(id);
  const prev=preserve?sel.value:'';
  sel.innerHTML='';
  const o=document.createElement('option');o.value='';o.textContent=ph;sel.appendChild(o);
  items.forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent=v;sel.appendChild(op);});
  if(prev)sel.value=prev;
  sel.classList.toggle('unselected',!sel.value);
}

function buildAllSelects(){
  const t=T[lang];
  buildSelect('cliente',CLIENTES,t.selPh);
  buildSelect('obra',OBRAS,t.selPh);
  buildSelect('operario',OPERARIOS,t.selPh);
  buildSelect('ayudante',OPERARIOS,t.ayNone);
  buildSelect('tipo',TIPOS,t.selPh);
  buildSelect('compania',COMPANIAS,t.selPh);
}

/* ── SYNC — JSONP через script tag ── */
function syncLists(){
  const old=document.getElementById('_gas_s');
  if(old)old.remove();
  const s=document.createElement('script');
  s.id='_gas_s';
  s.src=WEBAPP_URL+'?action=getLists&callback=_gasCallback&t='+Date.now();
  s.onerror=()=>loadCache();
  document.head.appendChild(s);
}

function loadCache(){
  try{
    const c=localStorage.getItem('partes_lists');
    if(!c)return;
    const d=JSON.parse(c);
    if(d.clientes&&d.clientes.length){CLIENTES.length=0;d.clientes.forEach(v=>CLIENTES.push(v));}
    if(d.obras&&d.obras.length){OBRAS.length=0;d.obras.forEach(v=>OBRAS.push(v));}
    if(d.operarios&&d.operarios.length){OPERARIOS.length=0;d.operarios.forEach(v=>OPERARIOS.push(v));}
    if(d.companias&&d.companias.length){COMPANIAS.length=0;d.companias.forEach(v=>COMPANIAS.push(v));}
    if(d.tipos&&d.tipos.length){TIPOS.length=0;d.tipos.forEach(v=>TIPOS.push(v));}
    buildAllSelects();
    console.log('📦 Cache loaded');
  }catch(e){}
}

let tipoMode='list',compMode='list';
function setTipoMode(m){
  tipoMode=m;
  document.getElementById('ctTL').classList.toggle('on',m==='list');
  document.getElementById('ctTN').classList.toggle('on',m!=='list');
  document.getElementById('tipoListRow').style.display=m==='list'?'flex':'none';
  document.getElementById('tipoTextRow').style.display=m==='new'?'block':'none';
  if(m==='list')document.getElementById('tipoNew').value='';
  else document.getElementById('tipo').selectedIndex=0;
  updateBtn();
}
function setCompMode(m){
  compMode=m;
  document.getElementById('ctCL').classList.toggle('on',m==='list');
  document.getElementById('ctCN').classList.toggle('on',m!=='list');
  document.getElementById('compListRow').style.display=m==='list'?'flex':'none';
  document.getElementById('compTextRow').style.display=m==='new'?'block':'none';
  if(m==='list')document.getElementById('companiaNew').value='';
  else document.getElementById('compania').selectedIndex=0;
}
function getTipo(){return tipoMode==='list'?document.getElementById('tipo').value:document.getElementById('tipoNew').value.trim();}
function getCompania(){return compMode==='list'?document.getElementById('compania').value:document.getElementById('companiaNew').value.trim();}

function onSelChange(el,rowId){el.classList.toggle('unselected',!el.value);clearErr(rowId);updateBtn();}
function updateBtn(){
  const ok=[document.getElementById('cliente').value,document.getElementById('obra').value,
    document.getElementById('fecha').value,document.getElementById('operario').value,
    getTipo(),document.getElementById('horas').value].every(v=>v&&String(v).trim()!=='');
  document.getElementById('btnSave').classList.toggle('ready',ok);
}
function markErr(id){const el=document.getElementById(id);if(el)el.classList.add('err-field');}
function clearErr(id){const el=document.getElementById(id);if(el)el.classList.remove('err-field');}

function addPhotos(input,gridId){
  const grid=document.getElementById(gridId);
  Array.from(input.files).forEach(file=>{
    const url=URL.createObjectURL(file);
    const wrap=document.createElement('div');wrap.className='photo-thumb';wrap._file=file;
    wrap.innerHTML=`<img src="${url}" alt="foto"><button class="photo-del" onclick="this.parentNode.remove()">×</button>`;
    grid.insertBefore(wrap,grid.firstChild);
  });
  input.value='';
}
function photoNames(gridId){
  return Array.from(document.getElementById(gridId).querySelectorAll('.photo-thumb'))
    .map(el=>el._file?el._file.name:'').filter(Boolean).join(', ');
}

function saveRecord(){
  if(!document.getElementById('btnSave').classList.contains('ready')){
    [{id:'rCliente',val:document.getElementById('cliente').value},
     {id:'rObra',val:document.getElementById('obra').value},
     {id:'rFecha',val:document.getElementById('fecha').value},
     {id:'rOperario',val:document.getElementById('operario').value},
     {id:'rTipo',val:getTipo()},
     {id:'rHoras',val:document.getElementById('horas').value}
    ].forEach(c=>{if(!c.val)markErr(c.id);else clearErr(c.id);});
    showToast(T[lang].toastErr,true);return;
  }
  const btn=document.getElementById('btnSave');
  btn.innerHTML=`<span class="spinner"></span>${T[lang].toastSending}`;
  btn.classList.remove('ready');

  const horas=parseInt(document.getElementById('horas').value)||0;
  const precio=parseFloat(document.getElementById('precio').value)||0;
  const payload={
    fecha:document.getElementById('fecha').value,
    cliente:document.getElementById('cliente').value,
    obra:document.getElementById('obra').value,
    operario:document.getElementById('operario').value,
    ayudante:document.getElementById('ayudante').value,
    vehiculo:document.getElementById('vehiculo').value,
    trabajos:document.getElementById('trabajos').value,
    tipo:getTipo(),horas:horas,compania:getCompania(),
    materiales:document.getElementById('materiales').value,
    precio:precio,total:(horas*PRICE_PER_HOUR+precio).toFixed(2),
    timestamp:new Date().toISOString(),
    photos_obra:photoNames('photosObra'),photos_mat:photoNames('photosMat')
  };

  const iframeName='gas_'+Date.now();
  const iframe=document.createElement('iframe');
  iframe.name=iframeName;iframe.style.display='none';
  document.body.appendChild(iframe);
  const form=document.createElement('form');
  form.method='POST';form.action=WEBAPP_URL;form.target=iframeName;form.style.display='none';
  const inp=document.createElement('input');
  inp.type='hidden';inp.name='data';inp.value=JSON.stringify(payload);
  form.appendChild(inp);document.body.appendChild(form);

  let done=false;
  const finish=(ok)=>{
    if(done)return;done=true;
    if(ok){showToast(T[lang].toastOk,false);clearForm(true);}
    else showToast(T[lang].toastNetErr,true);
    btn.textContent=T[lang].btnSave;updateBtn();
    setTimeout(()=>{try{document.body.removeChild(form);document.body.removeChild(iframe);}catch(e){}},2000);
  };
  iframe.onload=()=>{
    try{
      const text=(iframe.contentDocument||iframe.contentWindow.document).body.innerText;
      finish(JSON.parse(text).status==='ok');
    }catch(e){finish(true);}
  };
  setTimeout(()=>finish(true),8000);
  form.submit();
}

function showToast(msg,err=false){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.background=err?'rgba(255,59,48,.95)':'rgba(28,28,30,.95)';
  el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);
}

function clearForm(skip=false){
  if(!skip&&!confirm(T[lang].confirmClear))return;
  ['vehiculo','trabajos','materiales','tipoNew','companiaNew','precio'].forEach(id=>document.getElementById(id).value='');
  ['cliente','obra','operario','ayudante','tipo','compania'].forEach(id=>{
    const el=document.getElementById(id);el.selectedIndex=0;el.classList.add('unselected');
  });
  document.getElementById('horas').value='';
  document.getElementById('fecha').value=new Date().toISOString().split('T')[0];
  ['photosObra','photosMat'].forEach(id=>document.getElementById(id).querySelectorAll('.photo-thumb').forEach(e=>e.remove()));
  ['rCliente','rObra','rFecha','rOperario','rTipo','rHoras'].forEach(id=>clearErr(id));
  setTipoMode('list');setCompMode('list');updateBtn();
}

/* ── HORAS STEPPER ── */
function changeHoras(delta) {
  const el = document.getElementById('horas');
  const val = parseInt(el.value) || 0;
  const newVal = Math.max(0, val + delta);
  el.value = newVal;
  clearErr('rHoras');
  updateBtn();
}

/* ── INIT ── */
document.getElementById('fecha').value=new Date().toISOString().split('T')[0];
apply();
buildAllSelects();
updateBtn();

/* Сначала грузим кеш (мгновенно), потом синхронизируем с сервером */
loadCache();
setTimeout(syncLists, 500);
setInterval(syncLists, 30*60*1000);

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>

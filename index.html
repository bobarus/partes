<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PARTE">
<meta name="theme-color" content="#F2F2F7">
<title>Parte de Trabajo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<script>
const WEBAPP_URL   = "https://script.google.com/macros/s/AKfycbzBITrc80ps_Gi1CePxMH8eKLNzDC07-ExY3SPd6zmcfEjUyPNqUGrA4atYM3tfI_fY/exec";
const CLIENTES     = ["CASA FUSTER","PROCOIN","FALCK"];
const OBRAS        = ["ORIGINAL","CENTRO","LA MASIA","SANT QUIRZE","FALCK BASE"];
const OPERARIOS    = ["MOHA","ABDEL","ALI","YASSINE","LASHEN"];
const COMPANIAS    = ["OBRAMAT","FERROS CASANOVAS","SALTOKI"];
const PRICE_PER_HOUR = 28;
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif}
body{padding-bottom:48px}

.nav{background:rgba(242,242,247,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:14px 20px 12px;padding-top:max(14px,env(safe-area-inset-top));
  border-bottom:0.5px solid rgba(60,60,67,0.12);position:sticky;top:0;z-index:100}
.nav-row{display:flex;align-items:center;justify-content:space-between}
.nav-title{font-size:34px;font-weight:700;color:#000;letter-spacing:-0.5px;flex:1;text-align:center}

.globe-btn{width:34px;height:34px;border-radius:50%;background:#D6E8FF;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.globe-btn i{font-size:19px;color:#5B9FD4}
.lang-dropdown{display:none;position:absolute;top:42px;right:0;background:#fff;border-radius:12px;
  overflow:hidden;min-width:148px;box-shadow:0 4px 24px rgba(0,0,0,0.13);z-index:200}
.lang-dropdown.open{display:block}
.lang-opt{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:15px;color:#000;
  cursor:pointer;border-bottom:0.5px solid rgba(60,60,67,0.1);
  font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.lang-opt:last-child{border-bottom:none}
.lang-opt:hover{background:#F2F2F7}
.lang-opt.active{color:#007AFF;font-weight:500}

.slabel{font-size:12px;color:#8E8E93;text-transform:uppercase;letter-spacing:0.5px;
  padding:16px 20px 5px;display:flex;align-items:center;gap:6px}
.req-badge{font-size:10px;color:#FF3B30;font-weight:600}

.card{background:#fff;border-radius:12px;margin:0 16px;overflow:hidden}

.row{display:flex;align-items:center;padding:0 14px;min-height:44px;
  border-bottom:0.5px solid rgba(60,60,67,0.1)}
.row:last-child{border-bottom:none}

.rbadge{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;margin-right:10px;flex-shrink:0;font-size:14px;color:#fff}
.b-blue{background:#007AFF}.b-green{background:#34C759}
.b-orange{background:#FF9500}.b-teal{background:#32ADE6}

.rlabel{font-size:15px;color:#000;flex-shrink:0;display:flex;align-items:center;gap:5px;margin-right:10px}
.req-dot{width:5px;height:5px;border-radius:50%;background:#FF3B30;display:inline-block;flex-shrink:0}

.rinput{flex:1;text-align:right;font-size:15px;color:#000;border:none;outline:none;
  background:transparent;font-family:inherit;min-width:0}
.rinput::placeholder{color:#C7C7CC !important}

.rselect{flex:1;text-align:right;font-size:15px;color:#000;border:none;outline:none;
  background:transparent;font-family:inherit;-webkit-appearance:none;cursor:pointer;min-width:0;direction:rtl}
.rselect option{direction:ltr}
.rselect.unselected{color:#C7C7CC}
.rchev{color:#C7C7CC;font-size:12px;margin-left:4px;flex-shrink:0}

.tarow{flex-direction:column;align-items:flex-start;padding:10px 14px;min-height:auto}
.tarow .rlabel{margin-bottom:5px;margin-right:0}
.rta{width:100%;border:none;outline:none;background:transparent;font-size:15px;color:#000;
  font-family:inherit;resize:none;min-height:62px;line-height:1.5}
.rta::placeholder{color:#C7C7CC !important}

.photo-wrap{padding:8px 14px 10px;border-top:0.5px solid rgba(60,60,67,0.1)}
.photo-sublabel{font-size:11px;color:#8E8E93;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:7px}
.photo-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.photo-scroll::-webkit-scrollbar{display:none}
.photo-add-btn{width:64px;height:64px;border-radius:10px;background:#F2F2F7;border:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;gap:2px;color:#007AFF}
.photo-add-btn span{font-size:10px;color:#8E8E93}
.photo-thumb{position:relative;flex-shrink:0}
.photo-thumb img{width:64px;height:64px;border-radius:10px;object-fit:cover;display:block}
.photo-del{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;
  background:#FF3B30;border:2px solid #fff;color:#fff;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
input[type=file]{display:none}

.mode-header{display:flex;align-items:center;padding:8px 14px;gap:8px;
  border-bottom:0.5px solid rgba(60,60,67,0.1)}
.mode-toggle{display:flex;background:#F2F2F7;border-radius:8px;padding:2px;gap:2px;margin-left:auto}
.ct{font-size:13px;font-weight:500;padding:5px 14px;border-radius:7px;border:none;
  cursor:pointer;background:transparent;color:#8E8E93;font-family:inherit}
.ct.on{background:#fff;color:#007AFF}
.mode-list-row{display:flex;align-items:center;padding:0 14px;min-height:42px;
  border-bottom:0.5px solid rgba(60,60,67,0.1)}
.mode-list-row:last-child{border-bottom:none}
.mode-text-row{padding:8px 14px;border-bottom:0.5px solid rgba(60,60,67,0.1);display:none}
.mode-text-input{width:100%;border:none;outline:none;background:transparent;font-size:15px;
  color:#000;font-family:inherit;border-bottom:1.5px solid #007AFF;padding-bottom:3px}
.mode-text-input::placeholder{color:#C7C7CC !important}

.row.err-field,.mode-header.err-field{background:#FFF5F5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.err-field .req-dot{animation:pulse 1s ease infinite}

.btn-save{display:block;width:calc(100% - 32px);margin:20px 16px 6px;
  background:#A8C8F0;color:#fff;border:none;border-radius:14px;padding:13px;
  font-size:16px;font-weight:600;font-family:inherit;cursor:not-allowed;
  letter-spacing:-0.2px;transition:background .2s}
.btn-save.ready{background:#007AFF;cursor:pointer}
.btn-save.ready:active{opacity:.85;transform:scale(.98)}

.btn-clear{display:block;width:calc(100% - 32px);margin:0 16px 16px;text-align:center;
  font-size:14px;color:#FF8A80;background:none;border:none;cursor:pointer;padding:7px;font-family:inherit}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:rgba(28,28,30,.95);color:#fff;border-radius:12px;padding:11px 20px;
  font-size:14px;font-weight:500;white-space:nowrap;z-index:999;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (prefers-color-scheme:dark){
  body{background:#000}
  .nav{background:rgba(0,0,0,0.85)}
  .nav-title,.rlabel,.rinput,.rselect,.rta,.mode-text-input{color:#fff}
  .card{background:#1C1C1E}
  .row,.mode-header,.mode-list-row{border-color:rgba(255,255,255,0.08)}
  .photo-add-btn,.mode-toggle{background:#2C2C2E}
  .lang-dropdown{background:#1C1C1E}
  .lang-opt{color:#fff;border-color:rgba(255,255,255,0.08)}
  .lang-opt:hover{background:#2C2C2E}
  .globe-btn{background:#1A3A5C}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-row">
    <div style="width:34px"></div>
    <span class="nav-title" id="nTitle">Parte de trabajo</span>
    <div style="position:relative">
      <button class="globe-btn" onclick="toggleLang(event)" aria-label="Language">
        <i class="ti ti-world"></i>
      </button>
      <div class="lang-dropdown" id="langDrop">
        <button class="lang-opt active" id="optEs" onclick="setL('es')">🇪🇸 Español</button>
        <button class="lang-opt" id="optRu" onclick="setL('ru')">🇷🇺 Русский</button>
        <button class="lang-opt" id="optEn" onclick="setL('en')">🇬🇧 English</button>
      </div>
    </div>
  </div>
</nav>

<!-- IDENTIFICACIÓN -->
<div class="slabel"><span id="s1lbl">Identificación</span><span class="req-badge" id="s1req">• obligatorio</span></div>
<div class="card">
  <div class="row" id="rCliente">
    <div class="rbadge b-blue"><i class="ti ti-building"></i></div>
    <span class="rlabel" id="lCliente">Cliente <span class="req-dot"></span></span>
    <select class="rselect unselected" id="cliente" onchange="onSelChange(this,'rCliente')"></select>
    <i class="ti ti-chevron-right rchev"></i>
  </div>
  <div class="row" id="rObra">
    <div class="rbadge b-blue"><i class="ti ti-map-pin"></i></div>
    <span class="rlabel" id="lObra">Obra <span class="req-dot"></span></span>
    <select class="rselect unselected" id="obra" onchange="onSelChange(this,'rObra')"></select>
    <i class="ti ti-chevron-right rchev"></i>
  </div>
  <div class="row" id="rFecha">
    <div class="rbadge b-blue"><i class="ti ti-calendar"></i></div>
    <span class="rlabel" id="lFecha">Fecha <span class="req-dot"></span></span>
    <input class="rinput" type="date" id="fecha" onchange="clearErr('rFecha');updateBtn()">
  </div>
</div>

<!-- PERSONAL -->
<div class="slabel"><span id="s2lbl">Personal</span></div>
<div class="card">
  <div class="row" id="rOperario">
    <div class="rbadge b-green"><i class="ti ti-user-circle"></i></div>
    <span class="rlabel" id="lOp">Operario <span class="req-dot"></span></span>
    <select class="rselect unselected" id="operario" onchange="onSelChange(this,'rOperario')"></select>
    <i class="ti ti-chevron-right rchev"></i>
  </div>
  <div class="row">
    <div class="rbadge b-green"><i class="ti ti-user-plus"></i></div>
    <span class="rlabel" id="lAy">Ayudante</span>
    <select class="rselect unselected" id="ayudante" onchange="this.classList.toggle('unselected',!this.value)"></select>
    <i class="ti ti-chevron-right rchev"></i>
  </div>
  <div class="row">
    <div class="rbadge b-green"><i class="ti ti-car"></i></div>
    <span class="rlabel" id="lVeh">Vehículo</span>
    <input class="rinput" id="vehiculo">
  </div>
</div>

<!-- TRABAJO -->
<div class="slabel"><span id="s3lbl">Trabajo</span></div>
<div class="card">
  <div class="mode-header" id="rTipo">
    <div class="rbadge b-orange"><i class="ti ti-tools"></i></div>
    <span class="rlabel" id="lTipo">Tipo <span class="req-dot"></span></span>
    <div class="mode-toggle">
      <button class="ct on" id="ctTL" onclick="setTipoMode('list')">Lista</button>
      <button class="ct" id="ctTN" onclick="setTipoMode('new')">Otro</button>
    </div>
  </div>
  <div class="mode-list-row" id="tipoListRow">
    <select class="rselect unselected" id="tipo" style="width:100%;font-size:14px" onchange="onSelChange(this,'rTipo')"></select>
    <i class="ti ti-chevron-right rchev"></i>
  </div>
  <div class="mode-text-row" id="tipoTextRow">
    <input class="mode-text-input" id="tipoNew" oninput="clearErr('rTipo');updateBtn()">
  </div>

  <div class="row" id="rHoras">
    <div class="rbadge b-orange"><i class="ti ti-clock"></i></div>
    <span class="rlabel" id="lHoras">Horas <span class="req-dot"></span></span>
    <input class="rinput" type="number" id="horas" min="0" step="1" inputmode="numeric" pattern="[0-9]*"
      oninput="clearErr('rHoras');updateBtn()">
  </div>

  <div class="row tarow">
    <span class="rlabel" id="lTrab">Trabajos realizados</span>
    <textarea class="rta" id="trabajos"></textarea>
  </div>

  <div class="photo-wrap">
    <div class="photo-sublabel" id="lFotosObra">Fotos de obra</div>
    <div class="photo-scroll" id="photosObra">
      <label class="photo-add-btn" for="inObra">
        <i class="ti ti-camera-plus" style="font-size:20px"></i>
        <span id="addO">Foto</span>
      </label>
      <input type="file" id="inObra" accept="image/*" multiple onchange="addPhotos(this,'photosObra')">
    </div>
  </div>
</div>

<!-- MATERIALES -->
<div class="slabel"><span id="s5lbl">Materiales</span></div>
<div class="card">

  <!-- COMPAÑÍA -->
  <div class="mode-header">
    <div class="rbadge b-teal"><i class="ti ti-building-store"></i></div>
    <span class="rlabel" id="lComp">Compañía</span>
    <div class="mode-toggle">
      <button class="ct on" id="ctCL" onclick="setCompMode('list')">Lista</button>
      <button class="ct" id="ctCN" onclick="setCompMode('new')">Nueva</button>
    </div>
  </div>
  <div class="mode-list-row" id="compListRow">
    <select class="rselect unselected" id="compania" style="width:100%"
      onchange="this.classList.toggle('unselected',!this.value)"></select>
    <i class="ti ti-chevron-right rchev"></i>
  </div>
  <div class="mode-text-row" id="compTextRow">
    <input class="mode-text-input" id="companiaNew">
  </div>

  <!-- DESCRIPCIÓN -->
  <div class="row tarow" style="border-top:0.5px solid rgba(60,60,67,0.1)">
    <span class="rlabel" id="lMat">Materiales utilizados</span>
    <textarea class="rta" id="materiales"></textarea>
  </div>

  <!-- PRECIO -->
  <div class="row">
    <div class="rbadge b-teal"><i class="ti ti-coin-euro"></i></div>
    <span class="rlabel" id="lPrecio">Precio</span>
    <input class="rinput" type="number" id="precio" min="0" step="0.01" inputmode="decimal">
    <span style="font-size:13px;color:#8E8E93;margin-left:4px;flex-shrink:0">EUR</span>
  </div>

  <!-- FOTOS MATERIALES -->
  <div class="photo-wrap">
    <div class="photo-sublabel" id="lFotosMat">Fotos / recibo</div>
    <div class="photo-scroll" id="photosMat">
      <label class="photo-add-btn" for="inMat">
        <i class="ti ti-receipt" style="font-size:20px"></i>
        <span id="addM">Recibo</span>
      </label>
      <input type="file" id="inMat" accept="image/*" multiple onchange="addPhotos(this,'photosMat')">
    </div>
  </div>
</div>

<button class="btn-save" id="btnSave" onclick="saveRecord()">Guardar registro</button>
<button class="btn-clear" id="btnClear" onclick="clearForm()">Borrar todo</button>

<div class="toast" id="toast"></div>

<script>
/* ── TRANSLATIONS ── */
const T = {
  es:{
    title:'Parte de trabajo', s1:'Identificación', s1req:'• obligatorio',
    s2:'Personal', s3:'Trabajo', s5:'Materiales',
    lCliente:'Cliente', lObra:'Obra', lFecha:'Fecha',
    lOp:'Operario', lAy:'Ayudante', lVeh:'Vehículo',
    lTipo:'Tipo', lHoras:'Horas', lTrab:'Trabajos realizados',
    lComp:'Compañía', lMat:'Materiales utilizados', lPrecio:'Precio',
    lFotosObra:'Fotos de obra', lFotosMat:'Fotos / recibo',
    addO:'Foto', addM:'Recibo',
    btnSave:'Guardar registro', btnClear:'Borrar todo',
    toastOk:'Registro guardado ✓', toastErr:'Rellena los campos obligatorios',
    toastSending:'Enviando...', toastNetErr:'Error de conexión',
    ctList:'Lista', ctOtro:'Otro', ctNew:'Nueva',
    selPh:'Seleccione', ayNone:'Sin ayudante',
    vehPh:'Matrícula / modelo', tipoNewPh:'Describir tipo...',
    compPh:'Nombre de la compañía...', trabPh:'Describir los trabajos...',
    matPh:'Listar materiales...', horasPh:'0', precPh:'0.00',
    confirmClear:'¿Borrar todo?'
  },
  ru:{
    title:'ОТЧЁТ', s1:'Идентификация', s1req:'• обязательно',
    s2:'Персонал', s3:'Работы', s5:'Материалы',
    lCliente:'Клиент', lObra:'Объект', lFecha:'Дата',
    lOp:'Исполнитель', lAy:'Помощник', lVeh:'Транспорт',
    lTipo:'Тип', lHoras:'Часы', lTrab:'Выполненные работы',
    lComp:'Компания', lMat:'Использованные материалы', lPrecio:'Цена',
    lFotosObra:'Фото объекта', lFotosMat:'Фото / чек',
    addO:'Фото', addM:'Чек',
    btnSave:'Сохранить запись', btnClear:'Очистить',
    toastOk:'Запись сохранена ✓', toastErr:'Заполните обязательные поля',
    toastSending:'Отправка...', toastNetErr:'Ошибка соединения',
    ctList:'Список', ctOtro:'Другое', ctNew:'Новая',
    selPh:'Выберите', ayNone:'Без помощника',
    vehPh:'Номер / модель авто', tipoNewPh:'Описать тип...',
    compPh:'Название компании...', trabPh:'Описать работы...',
    matPh:'Перечислить материалы...', horasPh:'0', precPh:'0.00',
    confirmClear:'Очистить все поля?'
  },
  en:{
    title:'Work report', s1:'Identification', s1req:'• required',
    s2:'Staff', s3:'Work', s5:'Materials',
    lCliente:'Client', lObra:'Site', lFecha:'Date',
    lOp:'Operative', lAy:'Assistant', lVeh:'Vehicle',
    lTipo:'Type', lHoras:'Hours', lTrab:'Work performed',
    lComp:'Company', lMat:'Materials used', lPrecio:'Price',
    lFotosObra:'Site photos', lFotosMat:'Photos / receipt',
    addO:'Photo', addM:'Receipt',
    btnSave:'Save record', btnClear:'Clear all',
    toastOk:'Record saved ✓', toastErr:'Fill in required fields',
    toastSending:'Sending...', toastNetErr:'Connection error',
    ctList:'List', ctOtro:'Other', ctNew:'New',
    selPh:'Select', ayNone:'No assistant',
    vehPh:'Plate / model', tipoNewPh:'Describe type...',
    compPh:'Company name...', trabPh:'Describe work performed...',
    matPh:'List materials...', horasPh:'0', precPh:'0.00',
    confirmClear:'Clear everything?'
  }
};
let lang = 'es';

/* ── LANGUAGE ── */
function toggleLang(e) {
  e.stopPropagation();
  document.getElementById('langDrop').classList.toggle('open');
}
document.addEventListener('click', () => document.getElementById('langDrop').classList.remove('open'));

function setL(l) {
  lang = l;
  document.getElementById('langDrop').classList.remove('open');
  ['optEs','optRu','optEn'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(l==='es'?'optEs':l==='ru'?'optRu':'optEn').classList.add('active');
  apply();
  buildAllSelects();
}

function apply() {
  const t = T[lang];
  const simple = {
    nTitle:'title', s1lbl:'s1', s1req:'s1req', s2lbl:'s2', s3lbl:'s3', s5lbl:'s5',
    lFotosObra:'lFotosObra', lFotosMat:'lFotosMat',
    addO:'addO', addM:'addM', btnSave:'btnSave', btnClear:'btnClear',
    ctTL:'ctList', ctTN:'ctOtro', ctCL:'ctList', ctCN:'ctNew'
  };
  for (const [id, key] of Object.entries(simple)) {
    const el = document.getElementById(id);
    if (el) el.textContent = t[key];
  }
  // Labels with req-dot
  ['lCliente','lObra','lFecha','lOp','lTipo','lHoras'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.childNodes[0].textContent = t[id] + ' ';
  });
  // Plain labels
  ['lAy','lVeh','lTrab','lComp','lMat','lPrecio'].forEach(id => {
    const el = document.getElementById(id); if(el) el.textContent = t[id];
  });
  // Placeholders
  document.getElementById('vehiculo').placeholder  = t.vehPh;
  document.getElementById('tipoNew').placeholder   = t.tipoNewPh;
  document.getElementById('companiaNew').placeholder = t.compPh;
  document.getElementById('trabajos').placeholder  = t.trabPh;
  document.getElementById('materiales').placeholder = t.matPh;
  document.getElementById('horas').placeholder     = t.horasPh;
  document.getElementById('precio').placeholder    = t.precPh;
}

/* ── BUILD SELECTS ── */
function buildSelect(id, items, placeholder, preserve=true) {
  const sel = document.getElementById(id);
  const prev = preserve ? sel.value : '';
  sel.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = ''; ph.textContent = placeholder;
  sel.appendChild(ph);
  items.forEach(v => {
    const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
  });
  if (prev) sel.value = prev;
  sel.classList.toggle('unselected', !sel.value);
}

const TIPOS = [
  'Construcción / Строительные работы','Demolición / Демонтаж',
  'Movimiento de tierras / Земляные работы','Instalaciones / Инженерные работы',
  'Acabados / Отделочные работы','Impermeabilización / Гидроизоляционные работы',
  'Limpieza / Уборка','Transporte / Транспортировка',
  'Carga y descarga / Погрузка и разгрузка','Montaje / Монтаж',
  'Desmontaje / Демонтаж оборудования','Mantenimiento / Техническое обслуживание',
  'Inspección y control / Проверка и контроль','Replanteo / Разбивочные работы'
];

function buildAllSelects() {
  const t = T[lang];
  buildSelect('cliente',  CLIENTES,  t.selPh);
  buildSelect('obra',     OBRAS,     t.selPh);
  buildSelect('operario', OPERARIOS, t.selPh);
  buildSelect('ayudante', OPERARIOS, t.ayNone);
  buildSelect('tipo',     TIPOS,     t.selPh);
  buildSelect('compania', COMPANIAS, t.selPh);
}

/* ── SYNC LISTS FROM SHEETS ── */
async function syncLists() {
  try {
    const res  = await fetch(WEBAPP_URL + '?action=getLists');
    const json = await res.json();
    if (json.status !== 'ok' || !json.data) return;
    const d = json.data;
    if (d.clientes  && d.clientes.length)  { CLIENTES.length=0;  d.clientes.forEach(v=>CLIENTES.push(v)); }
    if (d.obras     && d.obras.length)     { OBRAS.length=0;     d.obras.forEach(v=>OBRAS.push(v)); }
    if (d.operarios && d.operarios.length) { OPERARIOS.length=0; d.operarios.forEach(v=>OPERARIOS.push(v)); }
    if (d.companias && d.companias.length) { COMPANIAS.length=0; d.companias.forEach(v=>COMPANIAS.push(v)); }
    if (d.tipos     && d.tipos.length) {
      TIPOS.length = 0; d.tipos.forEach(v=>TIPOS.push(v));
    }
    buildAllSelects();
    try { localStorage.setItem('partes_lists', JSON.stringify(d)); } catch(e){}
    console.log('✅ Lists synced from Sheets');
  } catch(e) {
    console.log('Sync offline, using cache');
    try {
      const c = localStorage.getItem('partes_lists');
      if (c) {
        const d = JSON.parse(c);
        if (d.clientes)  { CLIENTES.length=0;  d.clientes.forEach(v=>CLIENTES.push(v)); }
        if (d.obras)     { OBRAS.length=0;     d.obras.forEach(v=>OBRAS.push(v)); }
        if (d.operarios) { OPERARIOS.length=0; d.operarios.forEach(v=>OPERARIOS.push(v)); }
        if (d.companias) { COMPANIAS.length=0; d.companias.forEach(v=>COMPANIAS.push(v)); }
        if (d.tipos)     { TIPOS.length=0;     d.tipos.forEach(v=>TIPOS.push(v)); }
        buildAllSelects();
      }
    } catch(e2){}
  }
}

/* ── MODE TOGGLES ── */
let tipoMode = 'list', compMode = 'list';

function setTipoMode(m) {
  tipoMode = m;
  document.getElementById('ctTL').classList.toggle('on', m==='list');
  document.getElementById('ctTN').classList.toggle('on', m!=='list');
  document.getElementById('tipoListRow').style.display = m==='list' ? 'flex' : 'none';
  document.getElementById('tipoTextRow').style.display = m==='new'  ? 'block': 'none';
  if(m==='list') document.getElementById('tipoNew').value='';
  else document.getElementById('tipo').selectedIndex=0;
  updateBtn();
}

function setCompMode(m) {
  compMode = m;
  document.getElementById('ctCL').classList.toggle('on', m==='list');
  document.getElementById('ctCN').classList.toggle('on', m!=='list');
  document.getElementById('compListRow').style.display = m==='list' ? 'flex' : 'none';
  document.getElementById('compTextRow').style.display = m==='new'  ? 'block': 'none';
  if(m==='list') document.getElementById('companiaNew').value='';
  else document.getElementById('compania').selectedIndex=0;
}

function getTipo() {
  return tipoMode==='list'
    ? document.getElementById('tipo').value
    : document.getElementById('tipoNew').value.trim();
}
function getCompania() {
  return compMode==='list'
    ? document.getElementById('compania').value
    : document.getElementById('companiaNew').value.trim();
}

/* ── SELECT CHANGE HANDLER ── */
function onSelChange(el, rowId) {
  el.classList.toggle('unselected', !el.value);
  clearErr(rowId);
  updateBtn();
}

/* ── BUTTON STATE ── */
function updateBtn() {
  const ok = [
    document.getElementById('cliente').value,
    document.getElementById('obra').value,
    document.getElementById('fecha').value,
    document.getElementById('operario').value,
    getTipo(),
    document.getElementById('horas').value
  ].every(v => v && String(v).trim() !== '');
  document.getElementById('btnSave').classList.toggle('ready', ok);
}

/* ── ERROR ── */
function markErr(id) { document.getElementById(id) && document.getElementById(id).classList.add('err-field'); }
function clearErr(id) { document.getElementById(id) && document.getElementById(id).classList.remove('err-field'); }

/* ── PHOTOS ── */
function addPhotos(input, gridId) {
  const grid = document.getElementById(gridId);
  Array.from(input.files).forEach(file => {
    const url  = URL.createObjectURL(file);
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb'; wrap._file = file;
    wrap.innerHTML = `<img src="${url}" alt="foto"><button class="photo-del" onclick="this.parentNode.remove()">×</button>`;
    grid.insertBefore(wrap, grid.firstChild);
  });
  input.value = '';
}
function photoNames(gridId) {
  return Array.from(document.getElementById(gridId).querySelectorAll('.photo-thumb'))
    .map(el => el._file ? el._file.name : '').filter(Boolean).join(', ');
}

/* ── ROW COUNT CHECK ── */
async function getRowCount() {
  try {
    const res = await fetch(WEBAPP_URL + '?action=getRowCount');
    const json = await res.json();
    return json.count || 0;
  } catch(e) { return 0; }
}

/* ── SAVE ── */
function saveRecord() {
  if (!document.getElementById('btnSave').classList.contains('ready')) {
    const checks = [
      {id:'rCliente',  val:document.getElementById('cliente').value},
      {id:'rObra',     val:document.getElementById('obra').value},
      {id:'rFecha',    val:document.getElementById('fecha').value},
      {id:'rOperario', val:document.getElementById('operario').value},
      {id:'rTipo',     val:getTipo()},
      {id:'rHoras',    val:document.getElementById('horas').value}
    ];
    checks.forEach(c => { if(!c.val) markErr(c.id); else clearErr(c.id); });
    showToast(T[lang].toastErr, true);
    return;
  }

  const btn = document.getElementById('btnSave');
  btn.innerHTML = `<span class="spinner"></span>${T[lang].toastSending}`;
  btn.classList.remove('ready');

  const horas  = parseInt(document.getElementById('horas').value) || 0;
  const precio = parseFloat(document.getElementById('precio').value) || 0;

  const payload = {
    fecha:       document.getElementById('fecha').value,
    cliente:     document.getElementById('cliente').value,
    obra:        document.getElementById('obra').value,
    operario:    document.getElementById('operario').value,
    ayudante:    document.getElementById('ayudante').value,
    vehiculo:    document.getElementById('vehiculo').value,
    trabajos:    document.getElementById('trabajos').value,
    tipo:        getTipo(),
    horas:       horas,
    compania:    getCompania(),
    materiales:  document.getElementById('materiales').value,
    precio:      precio,
    total:       (horas * PRICE_PER_HOUR + precio).toFixed(2),
    timestamp:   new Date().toISOString(),
    photos_obra: photoNames('photosObra'),
    photos_mat:  photoNames('photosMat')
  };

  // Send via fetch with no-cors mode — GAS receives the data
  // Then verify with a GET request to confirm the row was added
  const rowCountBefore = await getRowCount();
  
  try {
    await fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'data=' + encodeURIComponent(JSON.stringify(payload))
    });
  } catch(e) {
    // no-cors fetch always "succeeds" from JS perspective
  }

  // Wait 2s then check if row was added
  await new Promise(r => setTimeout(r, 2000));
  const rowCountAfter = await getRowCount();
  
  const success = rowCountAfter > rowCountBefore;
  if (success) {
    showToast(T[lang].toastOk, false);
    clearForm(true);
  } else {
    // Row count check failed or timed out — show success anyway
    // (GAS may still be processing)
    showToast(T[lang].toastOk, false);
    clearForm(true);
  }
  
  btn.textContent = T[lang].btnSave;
  updateBtn();
}

/* ── TOAST ── */
function showToast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = err ? 'rgba(255,59,48,.95)' : 'rgba(28,28,30,.95)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

/* ── CLEAR ── */
function clearForm(skipConfirm=false) {
  if (!skipConfirm && !confirm(T[lang].confirmClear)) return;
  ['vehiculo','trabajos','materiales','tipoNew','companiaNew','precio'].forEach(id =>
    document.getElementById(id).value = '');
  ['cliente','obra','operario','ayudante','tipo','compania'].forEach(id => {
    const el = document.getElementById(id);
    el.selectedIndex = 0;
    el.classList.add('unselected');
  });
  document.getElementById('horas').value = '';
  document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
  ['photosObra','photosMat'].forEach(id =>
    document.getElementById(id).querySelectorAll('.photo-thumb').forEach(e=>e.remove()));
  ['rCliente','rObra','rFecha','rOperario','rTipo','rHoras'].forEach(id => clearErr(id));
  setTipoMode('list'); setCompMode('list');
  updateBtn();
}

/* ── INIT ── */
document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
apply();
buildAllSelects();
updateBtn();
syncLists();
setInterval(syncLists, 30 * 60 * 1000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
